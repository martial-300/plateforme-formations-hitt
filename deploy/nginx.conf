# Nginx — production. Modèle : ${DOMAINE} est remplacé au démarrage du conteneur
# (image officielle, /etc/nginx/templates) ; les variables nginx ($host…) ne sont pas touchées.

server {
    listen 80;
    server_name ${DOMAINE};

    # Défi Let's Encrypt (premier certificat et renouvellement)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAINE};

    ssl_certificate     /etc/letsencrypt/live/${DOMAINE}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAINE}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Les champs libres font 1 000 caractères au plus : 1 Mo suffit largement.
    client_max_body_size 1m;

    # Noms résolus à chaque requête (DNS de Docker) : après une mise à jour, backend et
    # frontend recréés avec une autre adresse restent joignables sans recharger nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:80;

    # API FastAPI (+ Swagger sur /docs) ; avec une variable, l'URI est transmise telle quelle.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        # IP réelle ajoutée à droite : uvicorn ne fait confiance qu'à nginx (FORWARDED_ALLOW_IPS).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React (build statique servi par le conteneur frontend)
    location / {
        proxy_pass $frontend;
        proxy_set_header Host $host;
    }
}
