# HIT-T Reco — Docker Compose
# Développement : `docker compose up -d db`, puis backend (uvicorn) et frontend (npm run dev)
# en local. `docker compose up -d --build` construit aussi backend et frontend ; le frontend
# conteneurisé n'est joignable que derrière nginx (production, S7).
# Ports publiés sur 127.0.0.1 uniquement : en production, seul nginx expose 80 et 443.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hitt}
      POSTGRES_USER: ${POSTGRES_USER:-hitt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Exécutés au premier démarrage uniquement (volume vide), par ordre alphabétique
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hitt} -d ${POSTGRES_DB:-hitt}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hitt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hitt}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend

  # nginx:   # production uniquement
  #   image: nginx:1.27-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./deploy/certbot:/var/www/certbot:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - backend
  #     - frontend

volumes:
  pgdata:
