# HIT-T Reco — Docker Compose
# Développement : `docker compose up -d db` suffit tant que backend/ et frontend/
# n'ont pas encore de Dockerfile. Décommenter les services au fur et à mesure.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hitt}
      POSTGRES_USER: ${POSTGRES_USER:-hitt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Exécutés au premier démarrage uniquement (volume vide), par ordre alphabétique
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hitt} -d ${POSTGRES_DB:-hitt}"]
      interval: 5s
      retries: 10

